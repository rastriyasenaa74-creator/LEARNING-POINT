<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fees | Learning Point</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><aside class="sidebar" id="sidebar"><div class="side-brand"><span class="brand-mark">LP</span>Learning Point</div><nav class="side-nav"><div class="side-title">FRANCHISE</div><a class="" href="dashboard.html"><span>▦</span>Dashboard</a><a class="" href="students.html"><span>🎓</span>Students</a><a class="" href="admissions.html"><span>📝</span>Admissions</a><a class="active" href="fees.html"><span>💳</span>Fees</a><a class="" href="reports.html"><span>📈</span>Reports</a><div class="side-title">Website</div><a href="../index.html">🌐 Website</a><a href="#" onclick="logout();return false">↪ Logout</a></nav></aside><div class="app-main"><header class="topbar"><div style="display:flex;gap:10px;align-items:center"><button class="btn btn-dark mobile-menu" onclick="sidebar.classList.toggle('open')">☰</button><strong>Fees</strong></div><div class="user-chip"><span id="uname">FRANCHISE</span><span class="avatar">LP</span></div></header><main class="content"><div class="page-head"><div><h1>Fees</h1><p>Manage fees records.</p></div><button class="btn" onclick="modal.classList.add('show')">+ Add New</button></div><div class="table-card"><table><thead><tr><th>Student ID</th><th>Amount</th><th>Payment Mode</th><th>Remarks</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div><div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h3>Add Record</h3><button class="close" onclick="modal.classList.remove('show')">×</button></div><form id="form"><div class="form-grid"><div class="field"><label>Student ID</label><input name="studentId" required></div><div class="field"><label>Amount</label><input name="amount" required></div><div class="field"><label>Payment Mode</label><input name="paymentMode" ></div><div class="field"><label>Remarks</label><input name="remarks" ></div></div><div class="form-actions"><button class="btn">Save</button></div></form></div></div><script>async function load(){const r=await getFees();const a=r.ok?(r.items||r.data||[]):[];rows.innerHTML=a.length?a.map(x=>`<tr><td>${x["studentId"]||""}</td><td>${x["amount"]||""}</td><td>${x["paymentMode"]||""}</td><td>${x["remarks"]||""}</td><td><button class="btn btn-sm btn-light">View</button></td></tr>`).join(''):'<tr><td colspan="5">No records found</td></tr>'}form.addEventListener('submit',async e=>{e.preventDefault();const r=await collectFee(Object.fromEntries(new FormData(e.target)));if(!r.ok)alert(r.error);else{modal.classList.remove('show');form.reset();load()}});load()</script></main></div><script src="../assets/js/api.js"></script><script>const u=getUser();if(u)uname.textContent=u.name||u.username||'FRANCHISE';</script></body></html>
