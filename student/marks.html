<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marks | Learning Point</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><aside class="sidebar" id="sidebar"><div class="side-brand"><span class="brand-mark">LP</span>Learning Point</div><nav class="side-nav"><div class="side-title">STUDENT</div><a class="" href="dashboard.html"><span>▦</span>Dashboard</a><a class="" href="profile.html"><span>👤</span>Profile</a><a class="" href="fees.html"><span>💳</span>Fees</a><a class="active" href="marks.html"><span>📊</span>Marks</a><a class="" href="marksheet.html"><span>📄</span>Marksheet</a><a class="" href="certificate.html"><span>🏆</span>Certificate</a><div class="side-title">Website</div><a href="../index.html">🌐 Website</a><a href="#" onclick="logout();return false">↪ Logout</a></nav></aside><div class="app-main"><header class="topbar"><div style="display:flex;gap:10px;align-items:center"><button class="btn btn-dark mobile-menu" onclick="sidebar.classList.toggle('open')">☰</button><strong>Marks</strong></div><div class="user-chip"><span id="uname">STUDENT</span><span class="avatar">LP</span></div></header><main class="content"><div class="page-head"><div><h1>Marks</h1><p>Manage marks records.</p></div><button class="btn" onclick="modal.classList.add('show')">+ Add New</button></div><div class="table-card"><table><thead><tr><th>Student ID</th><th>Exam ID</th><th>Subject</th><th>Marks</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div><div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h3>Add Record</h3><button class="close" onclick="modal.classList.remove('show')">×</button></div><form id="form"><div class="form-grid"><div class="field"><label>Student ID</label><input name="studentId" required></div><div class="field"><label>Exam ID</label><input name="examId" required></div><div class="field"><label>Subject</label><input name="subject" required></div><div class="field"><label>Marks</label><input name="marks" required></div></div><div class="form-actions"><button class="btn">Save</button></div></form></div></div><script>async function load(){const r=await getMarks();const a=r.ok?(r.items||r.data||[]):[];rows.innerHTML=a.length?a.map(x=>`<tr><td>${x["studentId"]||""}</td><td>${x["examId"]||""}</td><td>${x["subject"]||""}</td><td>${x["marks"]||""}</td><td><button class="btn btn-sm btn-light">View</button></td></tr>`).join(''):'<tr><td colspan="5">No records found</td></tr>'}form.addEventListener('submit',async e=>{e.preventDefault();const r=await saveMarks(Object.fromEntries(new FormData(e.target)));if(!r.ok)alert(r.error);else{modal.classList.remove('show');form.reset();load()}});load()</script></main></div><script src="../assets/js/api.js"></script><script>const u=getUser();if(u)uname.textContent=u.name||u.username||'STUDENT';</script></body></html>
