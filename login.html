<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Learning Point</title><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="form-page"><div class="form-card"><a class="brand" href="index.html"><span class="brand-mark">LP</span>Learning Point</a><h1 style="margin-top:22px">Portal Login</h1><p>Admin, Franchise or Student login.</p><form id="f"><div class="field"><label>Username</label><input name="username" required></div><div class="field" style="margin-top:14px"><label>Password</label><input type="password" name="password" required></div><div class="form-actions"><button class="btn">Login</button><a class="btn btn-light" href="index.html">Back</a></div><div id="msg"></div></form></div></main><script src="assets/js/api.js"></script><script>f.addEventListener('submit',async e=>{e.preventDefault();const x=new FormData(e.target),r=await login(x.get('username'),x.get('password'));if(!r.ok){msg.innerHTML='<div class="notice">'+escapeHTML(r.error)+'</div>';return}if(r.user.role==='ADMIN'||r.user.role==='SUPER_ADMIN')location.href='admin/dashboard.html';else if(r.user.role==='FRANCHISE')location.href='franchise/dashboard.html';else location.href='student/dashboard.html'})</script></body></html>
