<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses | Learning Point</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><aside class="sidebar" id="sidebar"><div class="side-brand"><span class="brand-mark">LP</span>Learning Point</div><nav class="side-nav"><div class="side-title">MAIN ADMIN</div><a class="" href="dashboard.html"><span>▦</span>Dashboard</a><a class="" href="students.html"><span>🎓</span>Students</a><a class="" href="franchises.html"><span>🏢</span>Franchises</a><a class="active" href="courses.html"><span>📚</span>Courses</a><a class="" href="admissions.html"><span>📝</span>Admissions</a><a class="" href="fees.html"><span>💳</span>Fees</a><a class="" href="exams.html"><span>📊</span>Exams</a><a class="" href="marks.html"><span>📝</span>Marks</a><a class="" href="marksheets.html"><span>📄</span>Marksheets</a><a class="" href="certificates.html"><span>🏆</span>Certificates</a><a class="" href="reports.html"><span>📈</span>Reports</a><a class="" href="settings.html"><span>⚙</span>Settings</a><div class="side-title">Website</div><a href="../index.html">🌐 Website</a><a href="#" onclick="logout();return false">↪ Logout</a></nav></aside><div class="app-main"><header class="topbar"><div style="display:flex;gap:10px;align-items:center"><button class="btn btn-dark mobile-menu" onclick="sidebar.classList.toggle('open')">☰</button><strong>Courses</strong></div><div class="user-chip"><span id="uname">MAIN ADMIN</span><span class="avatar">LP</span></div></header><main class="content"><div class="page-head"><div><h1>Courses</h1><p>Manage courses records.</p></div><button class="btn" onclick="modal.classList.add('show')">+ Add New</button></div><div class="table-card"><table><thead><tr><th>Course Name</th><th>Duration</th><th>Fee</th><th>Description</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div><div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h3>Add Record</h3><button class="close" onclick="modal.classList.remove('show')">×</button></div><form id="form"><div class="form-grid"><div class="field"><label>Course Name</label><input name="name" required></div><div class="field"><label>Duration</label><input name="duration" ></div><div class="field"><label>Fee</label><input name="fee" ></div><div class="field"><label>Description</label><input name="description" ></div></div><div class="form-actions"><button class="btn">Save</button></div></form></div></div><script>async function load(){const r=await getCourses();const a=r.ok?(r.items||r.data||[]):[];rows.innerHTML=a.length?a.map(x=>`<tr><td>${x["name"]||""}</td><td>${x["duration"]||""}</td><td>${x["fee"]||""}</td><td>${x["description"]||""}</td><td><button class="btn btn-sm btn-light">View</button></td></tr>`).join(''):'<tr><td colspan="5">No records found</td></tr>'}form.addEventListener('submit',async e=>{e.preventDefault();const r=await addCourse(Object.fromEntries(new FormData(e.target)));if(!r.ok)alert(r.error);else{modal.classList.remove('show');form.reset();load()}});load()</script></main></div><script src="../assets/js/api.js"></script><script>const u=getUser();if(u)uname.textContent=u.name||u.username||'MAIN ADMIN';</script></body></html>
